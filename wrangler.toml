name = "pips-worker"
main = "src/index.ts"
compatibility_date = "2024-12-01"

# [vars]
# SECRET_KEY will be set via `wrangler secret put`
[vars]
GITHUB_OWNER = "0xSatwik"
GITHUB_REPO = "pip-solver-answer"
GITHUB_BRANCH = "master"
GITHUB_PATH = "public/today.json"
CORS_ORIGINS = "https://pipsanswer.online,https://pipsanswer.vercel.app"

[[d1_databases]]
binding = "DB"
database_name = "pips-db"
database_id = "119270fd-c6c2-43e5-8492-6ccfc3012f34" # User: Run `wrangler d1 create pips-db` and update this ID

# Scheduled cron trigger - runs at 12:00 AM UTC every day
[triggers]
crons = ["0 0 * * *"]
